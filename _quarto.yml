project:
  type: website
  output-dir: docs
  # Reveal each lecture week by week: comment OUT its "!lectures/..." line
  # below (so it renders) once that lecture is taught, then uncomment the
  # matching entry in website.sidebar.contents further down. Doing only
  # one of the two either publishes an unlisted page (still reachable by
  # a direct URL) or links to a page that doesn't exist yet.
  render:
    - "*.qmd"
    - "lectures/*.qmd"
    - "!lectures/wyklad2.qmd"
    - "!lectures/wyklad3.qmd"
    - "!lectures/wyklad4.qmd"
    - "!lectures/wyklad5.qmd"
    - "!lectures/wyklad6.qmd"
    - "!lectures/wyklad7.qmd"

website:
  title: Projektowanie Relacyjnych Baz Danych
  description: "Projektowanie Relacyjnych Baz Danych dla studentów WAT w Warszawie"
  site-url: https://sebkaz-teaching.github.io/prba2026
  sidebar:
    style: "docked"
    contents:
      - index.qmd
      - section: "Wykłady"
        contents:
          - lectures/wyklad1.qmd
          # - lectures/wyklad2.qmd
          # - lectures/wyklad3.qmd
          # - lectures/wyklad4.qmd
          # - lectures/wyklad5.qmd
          # - lectures/wyklad6.qmd
          # - lectures/wyklad7.qmd
  page-footer: "Copyright 2026, Sebastian Zając"
format:
  html:
    page-layout: article
    css: style.css
    theme: cosmo
    toc: true
    toc-depth: 2
    toc-title: "**Sections**"
    self-contained-math: true
    code-overflow: wrap
    highlight-style: dark
    code-block-background: true
    link-external-newwindow: true
